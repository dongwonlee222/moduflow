id: superpowers
source: superpowers
source_url: https://github.com/obra/superpowers
local_path: ~/.codex/superpowers/skills
role: execution_method
moduflow_use:
  - brainstorming
  - writing plans
  - test-driven development
  - dispatching parallel agents
  - subagent-driven development
  - receiving code review
  - requesting code review
  - verification before completion
source_of_truth: git
reads:
  - specs/*/plan.md
  - specs/*/tasks.md
writes:
  - specs/*/status.md
  - code changes through normal project workflow
swap_policy: Replaceable if execution gates and verification evidence remain explicit.
reviewed:
  sha: 44c9b2d6e889982ac18c27d05a19fefe335194e1
  date: 2026-08-10
  note: >-
    Reviewed v6.2.0. It adds plan-scoped SDD workspaces, durable task ledgers,
    resume-based re-review loops with a five-round breaker, compressed skill
    guidance, and Windows/Codex portability fixes. The installed Superpowers
    checkout is updated so these disciplines are consumed directly. ModuFlow
    does not duplicate .superpowers/sdd state because worker-plan.json,
    status.md, review handoffs, and its independent verification gates remain
    canonical.
